databaseChangeLog:
  - changeSet:
      id: 002-create-raw-data
      author: neo-10
      changes:
        - createTable:
            tableName: raw_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: card_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: applied_date
                  type: DATE
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: raw_data
