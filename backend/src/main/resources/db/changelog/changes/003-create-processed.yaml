databaseChangeLog:
  - changeSet:
      id: 003-create-processed
      author: neo-10
      # This change set was applied locally before its YAML was reformatted. Keep the
      # recorded checksum valid so existing databases can start without resetting data.
      validCheckSum: 9:634e84fae85e2d4792d8a31656efa182
      changes:
        - createTable:
            tableName: processed
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: filename
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: processed
            columnNames: filename
            constraintName: uq_processed_filename
      rollback:
        - dropTable:
            tableName: processed
