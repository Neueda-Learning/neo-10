databaseChangeLog:
  - changeSet:
      id: 003-create-processed
      author: neo-10
      changes:
        - createTable:
            tableName: processed
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: filename
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: processed
            columnNames: filename
            constraintName: uq_processed_filename
      rollback:
        - dropTable:
            tableName: processed
