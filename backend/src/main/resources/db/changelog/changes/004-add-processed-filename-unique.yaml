databaseChangeLog:
  - changeSet:
      id: 004-add-processed-filename-unique
      author: neo-10
      preConditions:
        onFail: MARK_RAN
        not:
          or:
            # H2 reports this as a constraint, whereas MySQL reports it as a
            # named unique index. Either representation means 003 already added it.
            - uniqueConstraintExists:
                tableName: processed
                constraintName: uq_processed_filename
            - indexExists:
                tableName: processed
                indexName: uq_processed_filename
      changes:
        - addUniqueConstraint:
            tableName: processed
            columnNames: filename
            constraintName: uq_processed_filename
      rollback:
        - dropUniqueConstraint:
            tableName: processed
            constraintName: uq_processed_filename
